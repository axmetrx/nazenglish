[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Маршрутизация API запросов в Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA роутинг для React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
